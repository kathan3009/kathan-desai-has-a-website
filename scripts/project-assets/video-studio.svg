<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1014"/>
      <stop offset="1" stop-color="#1a1d24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0AD6FF"/>
      <stop offset="1" stop-color="#FFD60A"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>

  <!-- Filmstrip motif (rows of frames + sprocket holes) -->
  <g opacity="0.18">
    <g transform="translate(0,40)">
      <rect x="0" y="0" width="1600" height="120" fill="#1a1d24"/>
      <g fill="#0AD6FF" opacity="0.55">
        <rect x="40" y="20" width="170" height="80" rx="4"/>
        <rect x="240" y="20" width="170" height="80" rx="4"/>
        <rect x="440" y="20" width="170" height="80" rx="4"/>
        <rect x="640" y="20" width="170" height="80" rx="4"/>
        <rect x="840" y="20" width="170" height="80" rx="4"/>
        <rect x="1040" y="20" width="170" height="80" rx="4"/>
        <rect x="1240" y="20" width="170" height="80" rx="4"/>
        <rect x="1440" y="20" width="120" height="80" rx="4"/>
      </g>
      <g fill="#0e1014">
        <circle cx="20" cy="60" r="6"/><circle cx="60" cy="60" r="6"/><circle cx="100" cy="60" r="6"/>
        <circle cx="140" cy="60" r="6"/><circle cx="180" cy="60" r="6"/><circle cx="220" cy="60" r="6"/>
      </g>
    </g>
    <g transform="translate(0,340)">
      <rect x="0" y="0" width="1600" height="120" fill="#1a1d24"/>
      <g fill="#FFD60A" opacity="0.55">
        <rect x="80" y="20" width="170" height="80" rx="4"/>
        <rect x="280" y="20" width="170" height="80" rx="4"/>
        <rect x="480" y="20" width="170" height="80" rx="4"/>
        <rect x="680" y="20" width="170" height="80" rx="4"/>
        <rect x="880" y="20" width="170" height="80" rx="4"/>
        <rect x="1080" y="20" width="170" height="80" rx="4"/>
        <rect x="1280" y="20" width="170" height="80" rx="4"/>
      </g>
    </g>
  </g>

  <!-- Waveform line through the middle -->
  <g transform="translate(60,240)" stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.7">
    <path d="M0,0 Q40,-50 80,0 T160,0 T240,0 Q280,80 320,0 T400,0 T480,0 Q520,-60 560,0 T640,0 T720,0 Q760,40 800,0 T880,0 T960,0 Q1000,-70 1040,0 T1120,0 T1200,0 Q1240,50 1280,0 T1360,0 T1440,0"/>
  </g>

  <!-- Title -->
  <g font-family="Helvetica, Inter, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="800" y="244" font-size="120" font-weight="900" letter-spacing="-3" filter="url(#glow)" opacity="0.4">video-studio</text>
    <text x="800" y="244" font-size="120" font-weight="900" letter-spacing="-3">video-studio</text>
    <text x="800" y="296" font-size="26" font-weight="500" fill="#9aa3b0" letter-spacing="2">EDIT VIDEOS WITH CLAUDE CODE · FREE · LOCAL · MIT</text>
  </g>

  <!-- Tagline chips -->
  <g font-family="Helvetica, sans-serif" font-size="20" fill="#0AD6FF" text-anchor="middle">
    <g transform="translate(420,400)">
      <rect x="-90" y="-22" width="180" height="36" rx="18" fill="#0AD6FF" opacity="0.12"/>
      <text y="6">REEL</text>
    </g>
    <g transform="translate(620,400)">
      <rect x="-95" y="-22" width="190" height="36" rx="18" fill="#0AD6FF" opacity="0.12"/>
      <text y="6">PODCAST CLIP</text>
    </g>
    <g transform="translate(820,400)">
      <rect x="-80" y="-22" width="160" height="36" rx="18" fill="#0AD6FF" opacity="0.12"/>
      <text y="6">TUTORIAL</text>
    </g>
    <g transform="translate(1020,400)">
      <rect x="-90" y="-22" width="180" height="36" rx="18" fill="#0AD6FF" opacity="0.12"/>
      <text y="6">EXPLAINER</text>
    </g>
    <g transform="translate(1200,400)">
      <rect x="-75" y="-22" width="150" height="36" rx="18" fill="#0AD6FF" opacity="0.12"/>
      <text y="6">SQUARE</text>
    </g>
  </g>
</svg>
